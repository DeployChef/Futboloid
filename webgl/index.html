<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Futboloid</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!-- Как itch: клик «Играть» → только потом грузим билд. -->
    <div id="play-landing" class="play-landing" aria-label="Futboloid">
      <div class="play-landing__stage">
        <div class="play-landing__pitch" aria-hidden="true"></div>
        <div class="play-landing__grain" aria-hidden="true"></div>

        <p class="play-landing__mark">DEVCHEF&nbsp;·&nbsp;WEB</p>

        <h1 class="play-landing__title" aria-label="Futboloid">
          <span class="play-landing__word play-landing__word--a">FUT</span>
          <span class="play-landing__word play-landing__word--b">BO</span>
          <span class="play-landing__word play-landing__word--c">LOID</span>
        </h1>

        <p class="play-landing__side">ПОРТРЕТНЫЙ&nbsp;ФУТБОЛ</p>

        <button type="button" id="play-button" class="play-landing__kickoff">
          <span class="play-landing__kickoff-ring" aria-hidden="true"></span>
          <span class="play-landing__kickoff-label" id="play-button-label">Играть</span>
        </button>

        <p class="play-landing__whistle" id="play-hint">свисток — кикофф</p>

        <div class="play-landing__progress" id="play-progress-wrap" hidden>
          <div class="play-landing__progress-bar" id="play-progress"></div>
        </div>
      </div>
    </div>

    <div id="unity-container" class="unity-desktop unity-portrait" hidden>
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Futboloid</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var landing = document.querySelector("#play-landing");
      var playButton = document.querySelector("#play-button");
      var playLabel = document.querySelector("#play-button-label");
      var playHint = document.querySelector("#play-hint");
      var playProgressWrap = document.querySelector("#play-progress-wrap");
      var playProgress = document.querySelector("#play-progress");
      var container = document.querySelector("#unity-container");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Имена из свежего билда (без .unityweb)
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Fut.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Fut.data",
        frameworkUrl: buildUrl + "/Fut.framework.js",
        codeUrl: buildUrl + "/Fut.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DevChefGames",
        productName: "Futboloid",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      function prepareContainer() {
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile unity-portrait";
          canvas.className = "unity-mobile";
        } else {
          container.className = "unity-desktop unity-portrait";
        }
        container.hidden = false;
        document.querySelector("#unity-loading-bar").style.display = "block";
      }

      function startUnity() {
        playButton.disabled = true;
        playLabel.textContent = "…";
        playHint.textContent = "загрузка";
        playProgressWrap.hidden = false;

        prepareContainer();
        landing.classList.add("play-landing--leaving");

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            var pct = Math.round(100 * progress);
            playProgress.style.width = pct + "%";
            document.querySelector("#unity-progress-bar-full").style.width = pct + "%";
          }).then(function (unityInstance) {
            landing.remove();
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = function () {
              unityInstance.SetFullscreen(1);
            };
          }).catch(function (message) {
            alert(message);
            playButton.disabled = false;
            playLabel.textContent = "Играть";
            playHint.textContent = "свисток — кикофф";
            playProgressWrap.hidden = true;
            landing.classList.remove("play-landing--leaving");
          });
        };
        script.onerror = function () {
          alert("Не удалось загрузить билд Unity.");
          playButton.disabled = false;
          playLabel.textContent = "Играть";
          playHint.textContent = "ошибка загрузки";
          playProgressWrap.hidden = true;
          landing.classList.remove("play-landing--leaving");
        };
        document.body.appendChild(script);
      }

      playButton.addEventListener("click", startUnity);
    </script>
  </body>
</html>
