<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
  <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <div id="play-landing" class="play-landing" aria-label="{{{ PRODUCT_NAME }}}">
      <div class="play-landing__stage">
        <div class="play-landing__pitch" aria-hidden="true"></div>
        <div class="play-landing__grain" aria-hidden="true"></div>

        <p class="play-landing__mark">DEVCHEF&nbsp;·&nbsp;WEB</p>

        <h1 class="play-landing__title" aria-label="{{{ PRODUCT_NAME }}}">
          <span class="play-landing__word play-landing__word--a">FUT</span>
          <span class="play-landing__word play-landing__word--b">BO</span>
          <span class="play-landing__word play-landing__word--c">LOID</span>
        </h1>

        <p class="play-landing__side">ПОРТРЕТНЫЙ&nbsp;ФУТБОЛ</p>

        <button type="button" id="play-button" class="play-landing__kickoff">
          <span class="play-landing__kickoff-ring" aria-hidden="true"></span>
          <span class="play-landing__kickoff-label">Играть</span>
        </button>

        <p class="play-landing__whistle">свисток&nbsp;—&nbsp;кикофф</p>
      </div>
    </div>

    <div id="unity-container" class="unity-desktop unity-portrait" hidden>
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
#if SHOW_DIAGNOSTICS
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>

    <script>
      // Host-page only (как itch): Unity/FMOD стартуют после жеста «Играть».
      (function () {
        var unlocked = false;

        function resumeIfSuspended(ctx) {
          // closed нельзя resume — будет InvalidStateError
          if (!ctx || ctx.state !== 'suspended' || typeof ctx.resume !== 'function') return;
          ctx.resume().catch(function () {});
        }

        function wrap(name) {
          var Original = self[name];
          if (!Original) return;
          self[name] = new Proxy(Original, {
            construct: function (Target, args) {
              var ctx = Reflect.construct(Target, args);
              if (unlocked) resumeIfSuspended(ctx);
              return ctx;
            }
          });
          self[name].prototype = Original.prototype;
        }

        wrap('AudioContext');
        wrap('webkitAudioContext');

        self.__futboloidMarkAudioUnlocked = function () {
          unlocked = true;
        };
      })();

      var canvas = document.querySelector("#unity-canvas");
      var landing = document.querySelector("#play-landing");
      var playButton = document.querySelector("#play-button");
      var container = document.querySelector("#unity-container");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      function prepareContainer() {
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile unity-portrait";
          canvas.className = "unity-mobile";
#if SHOW_DIAGNOSTICS
          let diagnostics_icon = document.getElementById("diagnostics-icon");
          diagnostics_icon.style.position = "fixed";
          diagnostics_icon.style.bottom = "10px";
          diagnostics_icon.style.right = "0px";
          canvas.after(diagnostics_icon);
#endif
        } else {
          container.className = "unity-desktop unity-portrait";
        }
#if BACKGROUND_FILENAME
        canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
        container.hidden = false;
        document.querySelector("#unity-loading-bar").style.display = "block";
      }

      function startUnity() {
        self.__futboloidMarkAudioUnlocked();
        playButton.disabled = true;
        landing.classList.add("play-landing--leaving");
        prepareContainer();

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then(function (unityInstance) {
            landing.remove();
            document.querySelector("#unity-loading-bar").style.display = "none";
#if SHOW_DIAGNOSTICS
            document.getElementById("diagnostics-icon").onclick = function () {
              unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
            };
#endif
            document.querySelector("#unity-fullscreen-button").onclick = function () {
              unityInstance.SetFullscreen(1);
            };
#if DEVELOPMENT_PLAYER
            var profile = unityProfiler.createButton(unityInstance);
            profile.style.marginLeft = '5px';
            document.querySelector("#unity-build-title").appendChild(profile);

            var quit = document.createElement("button");
            quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
            quit.innerHTML = "Unload";
            document.querySelector("#unity-build-title").appendChild(quit);
            quit.onclick = function () {
              unityInstance.Quit().then(function () {
                unityProfiler.shutDown();
                document.querySelector("#unity-container").remove();
                canvas = null;
                script.remove();
                script = null;
              });
            };
#endif
          }).catch(function (message) {
            alert(message);
            playButton.disabled = false;
            landing.classList.remove("play-landing--leaving");
          });
        };
        script.onerror = function () {
          alert("Не удалось загрузить билд Unity.");
          playButton.disabled = false;
          landing.classList.remove("play-landing--leaving");
        };
        document.body.appendChild(script);
      }

      playButton.addEventListener("click", startUnity);
    </script>
  </body>
</html>
